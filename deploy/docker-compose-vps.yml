services:
  # Company Info API Service
  company-info-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: ghcr.io/artemkdr/company-info-api:latest
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-.env}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/v1/health"]
      interval: 60s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - company-info-api-network
    deploy:
      resources:
        limits: # Set resource limits
          memory: 1G       
          cpus: '2.0'  # the biggest for company-info-api main service   
        reservations: # Ensure minimum resources
          memory: 512M
          cpus: '0.5'

  # Nginx reverse proxy
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-.env}
    depends_on:
      company-info-api:
        condition: service_healthy
    # Increase file descriptor limits for high concurrency
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    ports: 
      # Map port 81 on the host to port 80 in the container for HTTP traffic
      # We use 81 because the port 80 is already busy on VPS
      - "81:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/api/health"]
      interval: 60s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - company-info-api-network
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 32M
          cpus: '0.05'

networks:
  company-info-api-network:
    driver: bridge
