env:
  contexts:
    - name: "Default Context"
      urls:
        - "http://zap-auth-proxy:80/"
  parameters: {}
  vars: {}

jobs:
  - name: openapi
    type: openapi
    parameters:
      apiFile: "/zap/wrk/config/openapi-enriched.json"
      context: "Default Context"
      targetUrl: "http://zap-auth-proxy:80"

  - name: spider
    type: spider
    parameters:
      url: "http://zap-auth-proxy:80/api/v1/health"
      maxDepth: 3

  - name: activeScan
    type: activeScan
    parameters:
      url: "http://zap-auth-proxy:80/"
      policy: "Default Policy"

  - name: alertFilter
    type: alertFilter
    alertFilters:
      - ruleId: 3
        newRisk: "False Positive"
      - ruleId: 6
        newRisk: "Low"
        url: "/api/v1/health"
      - ruleId: 10098
        newRisk: "False Positive"

  - name: report
    type: report
    parameters:
      template: "traditional-html"
      reportDir: "/zap/wrk/reports/${SCAN_TIMESTAMP}-enriched"
      reportFile: "report-enriched.html"
      reportTitle: "ZAP DAST Enriched Scan"

  - name: report-json
    type: report
    parameters:
      template: "traditional-json"
      reportDir: "/zap/wrk/reports/${SCAN_TIMESTAMP}-enriched"
      reportFile: "report-enriched.json"
      reportTitle: "ZAP DAST Enriched Scan"
