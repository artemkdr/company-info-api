user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    default_type text/plain;
    access_log off;

    # INSEE (8081) - returns canned JSON
    server {
        listen 8081;
        server_name _;
        default_type application/json;

        location / {
            return 200 '{"businesses":[{"siren":"123456789","legalName":"Test Company","registrationStatus":"Active"}]}';
        }
    }

    # VIES (8082) - returns canned XML
    server {
        listen 8082;
        server_name _;
        default_type text/xml;

        location / {
            return 200 '<?xml version="1.0" encoding="UTF-8"?><checkVatResponse><valid>true</valid><countryCode>FR</countryCode><vatNumber>12345678901</vatNumber><name>Test Company</name></checkVatResponse>';
        }
    }

    # ChIde (8083) - returns canned JSON
    server {
        listen 8083;
        server_name _;
        default_type application/json;

        location / {
            return 200 '{"uid":"CHE123456789","name":"Test AG","registered":true}';
        }
    }

    # BODACC (8084) - returns canned JSON
    server {
        listen 8084;
        server_name _;
        default_type application/json;

        location / {
            return 200 '{"results":[{"name":"Test Company","registrationNumber":"123456789","status":"Active"}]}';
        }
    }

    # OpenIban (8085) - health endpoint only, also canned JSON for IBAN validation
    server {
        listen 8085;
        server_name _;
        default_type application/json;

        location /health {
            return 200 'OK';
        }

        location / {
            return 200 '{"valid":true,"iban":"DE89370400440532013000","bic":"COBADEFFXXX"}';
        }
    }
}
