name: "Build automatically"

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - '.github/workflows/**'
      - '!.github/workflows/build.yml'
      - '**/*.md'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - '.github/workflows/**'
      - '!.github/workflows/build.yml'
      - '**/*.md'
jobs:
  build:
    uses: ./.github/workflows/build.yml
